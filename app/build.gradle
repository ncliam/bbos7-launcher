plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.q25.bbos7"
    compileSdk 35

    defaultConfig {
        applicationId "com.q25.bbos7"
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName System.getenv("VERSION_NAME") ?: "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("BBOS7_KEYSTORE")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("BBOS7_KEYSTORE_PASSWORD")
                keyAlias System.getenv("BBOS7_KEY_ALIAS")
                keyPassword System.getenv("BBOS7_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv("BBOS7_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}

dependencies {
    // Khong dung appcompat: theme cua launcher la android:Theme.Material,
    // AppCompatActivity se crash vi doi theme AppCompat.
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-ktx:1.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
}
